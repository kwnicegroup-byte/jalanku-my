main{max-width:760px;margin:auto;padding:12px}
.panel{background:#fff;border:1px solid #e1eae6;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #12382c0b}
label{display:block;font-weight:700;margin:8px 0}

.primary{background:#075e4b;color:#fff}.secondary{background:#e2eee9;color:#075e4b}.stop{background:#fbe5e5;color:#9b2222}

#fullscreenBtn{margin:0 0 8px;padding:11px;background:#e2eee9;color:#075e4b;border:1px solid #c8dfd7}

#mapPanel.fullscreen-mode #map{flex:1;height:auto;min-height:0;max-height:none;border-radius:10px}
#mapPanel.fullscreen-mode #navBanner{flex-shrink:0;margin-bottom:8px;padding:12px}
#mapPanel.fullscreen-mode #nextTurn{font-size:24px}
#mapPanel.fullscreen-mode #fullscreenBtn{flex-shrink:0}

#status{background:#f4f7f6;border-radius:10px;padding:12px;line-height:1.45;overflow-wrap:anywhere}

#nextRoad{font-size:15px}
#liveSummary{font-size:16px;font-weight:700;margin-top:10px;line-height:1.5}
#summary{font-weight:700;margin:10px 0}

.small{color:#52645f;font-size:12px;line-height:1.5}

</section>

 $("navBanner").style.display="block";$("nextTurn").textContent=st.text;$("nextRoad").textContent=(st.road?st.road+" · ":"")+Math.max(0,Math.round(d))+" "+t("meters");updateLiveSummary();
 if(d<250&&lastSpoken!==stepCursor){say(st.text+(st.road?(lang==="zh"?"，进入":lang==="ms"?" ke ":" onto ")+st.road:""));lastSpoken=stepCursor}
 if(stepCursor>=routeSteps.length-1&&d<35){status(t("arrived"));say(t("arrived"));stopNavigation(false);return}
}
function startNavigation(){
 if(watchId!==null)return;
 if(!start||!routeLayer){status(t("noStart"));return}
 if(!navigator.geolocation){status(t("noGps"));return}
 if("speechSynthesis" in window)say(t("navStarted"));else status(t("navStarted")+" (Voice not supported)");
 // Switch from whole-route overview to a close road-level navigation view.
 map.setView([start.lat,start.lon],17);
 watchId=navigator.geolocation.watchPosition(p=>{
  const pos={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};
  if(userMarker)userMarker.setLatLng([pos.lat,pos.lon]);else userMarker=L.circleMarker([pos.lat,pos.lon],{radius:9,color:"#fff",weight:3,fillColor:"#e05252",fillOpacity:1}).addTo(map).bindPopup("Current location / 当前位置");
  start=pos;if(map.getZoom()<17)map.setView([pos.lat,pos.lon],17,{animate:true});else map.panTo([pos.lat,pos.lon],{animate:true});updateBanner(pos)
 },()=>status(t("noGps")),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
 $("startNavBtn").disabled=true;$("stopNavBtn").disabled=false;status(t("navStarted"))
}
function stopNavigation(show=true){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(window.speechSynthesis)window.speechSynthesis.cancel();$("startNavBtn").disabled=!routeLayer;$("stopNavBtn").disabled=true;if(show)status(t("navStopped"))}
$("language").addEventListener("change",applyLanguage);$("clearHistoryBtn").addEventListener("click",clearHistory);$("fullscreenBtn").addEventListener("click",toggleFullscreen);$("routeBtn").addEventListener("click",()=>searchDestinations(false));$("nearHospitalBtn").addEventListener("click",()=>findNearby("hospital"));$("nearPoliceBtn").addEventListener("click",()=>findNearby("police"));$("nearFuelBtn").addEventListener("click",()=>findNearbyService("fuel"));$("nearAtmBtn").addEventListener("click",()=>findNearbyService("atm"));$("emergencyBtn").addEventListener("click",()=>{if(confirm(lang==="zh"?"即将打开手机拨号器拨打马来西亚紧急号码 999。是否继续？":lang==="ms"?"Buka pendail untuk menghubungi nombor kecemasan Malaysia 999?":"Open the phone dialer to call Malaysia emergency number 999?"))window.location.href="tel:999"});$("startNavBtn").addEventListener("click",startNavigation);$("stopNavBtn").addEventListener("click",()=>stopNavigation(true));$("destination").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(liveSearchTimer)clearTimeout(liveSearchTimer);searchDestinations(false)}});$("destination").addEventListener("input",()=>{if(liveSearchTimer)clearTimeout(liveSearchTimer);liveSearchSeq++;const q=$("destination").value.trim();if(q.length<3){$("searchResults").style.display="none";return}liveSearchTimer=setTimeout(()=>searchDestinations(true),850)});
applyLanguage();useGps().catch(()=>status(t("noGps")));
})();

// PWA install support. Install availability depends on the browser and its criteria.
let deferredInstallPrompt = null;
const installBtn = document.getElementById("installAppBtn");
function isStandaloneApp(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function refreshInstallButton(){
  if (installBtn) installBtn.style.display = (!isStandaloneApp() && (deferredInstallPrompt || /Android/i.test(navigator.userAgent))) ? "inline-block" : "none";
}
window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  refreshInstallButton();
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  if (installBtn) installBtn.style.display = "none";
});
if (installBtn) installBtn.addEventListener("click", async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch (_) {}
    deferredInstallPrompt = null;
    refreshInstallButton();
  } else {
    const msg = lang === "zh"
      ? "若没有弹出安装窗口：请在 Chrome 打开本网站，点右上角 ⋮，选择“安装应用”或“添加到主屏幕”。"
      : lang === "ms"
      ? "Jika tiada tetingkap pemasangan: buka laman ini dalam Chrome, tekan ⋮ dan pilih “Install app” atau “Add to Home screen”."
      : "If no install prompt appears: open this site in Chrome, tap ⋮, then choose “Install app” or “Add to Home screen”.";
    alert(msg);
  }
});
refreshInstallButton();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
