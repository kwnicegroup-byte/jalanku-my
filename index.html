<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#202124;background:#f1f3f4}
header{background:#fff;color:#202124;padding:14px 16px;box-shadow:0 2px 8px #00000012;position:relative;z-index:2}
header h1{margin:0;font-size:25px;color:#176b57}header p{margin:5px 0 0;font-size:13px;color:#5f6368}
main{max-width:760px;margin:auto;padding:14px}
.panel{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000c}
label{display:block;font-weight:700;margin:8px 0}
input,select,button{width:100%;font:inherit;border-radius:10px;padding:13px}
input,select{border:1px solid #cbd5e1;background:#fff;color:#172b26}
button{border:0;font-weight:700;cursor:pointer;margin-top:8px}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#075e4b;color:#fff}.secondary{background:#e2eee9;color:#075e4b}.stop{background:#fbe5e5;color:#9b2222}
#map{height:48vh;min-height:300px;max-height:560px;border-radius:16px;background:#e5e7eb;overflow:hidden}
#fullscreenBtn{margin:0 0 8px;padding:11px;background:#e2eee9;color:#075e4b;border:1px solid #c8dfd7}
#mapPanel.fullscreen-mode{position:fixed;inset:0;z-index:9999;width:100%;height:100%;max-width:none;margin:0;padding:8px;border-radius:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}
#mapPanel.fullscreen-mode #map{flex:1;height:auto;min-height:0;max-height:none;border-radius:10px}
#mapPanel.fullscreen-mode #navBanner{flex-shrink:0;margin-bottom:8px;padding:12px}
#mapPanel.fullscreen-mode #nextTurn{font-size:24px}
#mapPanel.fullscreen-mode #fullscreenBtn{flex-shrink:0}
body.fullscreen-active{overflow:hidden}
#status{background:#f4f7f6;border-radius:10px;padding:12px;line-height:1.45;overflow-wrap:anywhere}
#navBanner{display:none;background:#176b57;color:white;padding:18px;border-radius:16px;margin-bottom:12px;box-shadow:0 3px 12px #00000016}
#nextTurn{font-size:27px;font-weight:700;margin-bottom:5px}
#nextRoad{font-size:15px}
#liveSummary{font-size:16px;font-weight:700;margin-top:10px;line-height:1.5}
#summary{font-weight:700;margin:10px 0}
#steps{padding-left:22px;line-height:1.5}#steps li{margin:7px 0}
.small{color:#52645f;font-size:12px;line-height:1.45}
@media(max-width:420px){header h1{font-size:24px}#map{height:42vh;min-height:280px}}
</style>
</head>
<body>
<header><h1>🇲🇾 JALANKU</h1><p id="tagline">马来西亚导航 · Malaysia Navigation</p></header>
<main>
<section class="panel">
<label for="language" id="languageLabel">语言 / Bahasa / Language</label>
<select id="language"><option value="zh">简体中文</option><option value="ms">Bahasa Melayu</option><option value="en">English</option></select>

<input id="destination" type="text" placeholder="输入目的地" autocomplete="street-address">
<button id="routeBtn" class="primary" type="button">搜索目的地并规划路线</button>
<button id="startNavBtn" class="primary" type="button" disabled>▶ 开始实时导航与语音提示</button>
<button id="stopNavBtn" class="stop" type="button" disabled>■ 停止导航</button>
<p class="small" id="voiceNote">网页会自动尝试获取 GPS。规划路线后，请点击“开始实时导航与语音提示”，并保持网页打开。</p>
</section>
<section class="panel" id="mapPanel"><button id="fullscreenBtn" type="button" aria-pressed="false">⛶ 全屏地图</button><div id="navBanner"><div id="nextTurn">准备导航</div><div id="nextRoad"></div><div id="liveSummary"></div></div><div id="map" role="application" aria-label="JALANKU map"></div></section>
<section class="panel">
<h2 id="infoTitle" style="font-size:20px;margin:0 0 10px">导航信息</h2>
<div id="status" aria-live="polite">准备就绪。请允许定位并输入目的地。</div>
<div id="summary"></div><ol id="steps"></ol>
<p class="small" id="disclaimer">原型测试版：路线、GPS 与语音依赖手机浏览器及外部免费地图服务，可能不含实时交通，不能保证与专业导航相同。请出发前确认路线；驾驶时不要操作手机。</p>
</section>
</main>

async function toggleFullscreen(){

  panel.classList.add("fullscreen-mode");document.body.classList.add("fullscreen-active");

function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error(t("noGps")));navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),()=>reject(new Error(t("noGps"))),{enableHighAccuracy:true,timeout:20000,maximumAge:5000})})}

async function geocode(q){const wait=Math.max(0,1100-(Date.now()-lastSearch));if(wait)await new Promise(r=>setTimeout(r,wait));lastSearch=Date.now();const u=new URL("https://nominatim.openstreetmap.org/search");u.searchParams.set("q",q);u.searchParams.set("format","jsonv2");u.searchParams.set("limit","1");u.searchParams.set("countrycodes","my");u.searchParams.set("accept-language",lang==="zh"?"zh":lang);const res=await fetch(u);if(!res.ok)throw new Error(t("service"));const data=await res.json();if(!data.length)throw new Error(t("notFound"));const selected=data[0];return{lat:+selected.lat,lon:+selected.lon,name:selected.display_name}}
function stepText(s){const type=s.maneuver?.type,mod=s.maneuver?.modifier||"";if(type==="arrive")return t("arrive");if(type==="depart")return t("depart");if(type==="roundabout"||type==="rotary")return t("round");if(type==="uturn")return t("uturn");if(mod.includes("left"))return t("left");if(mod.includes("right"))return t("right");if(type==="turn")return t("turn");return t("continue")}
function duration(sec){const m=Math.round(sec/60),h=Math.floor(m/60),r=m%60;if(lang==="zh")return h?h+"小时"+r+"分钟":r+"分钟";return h?h+" hr "+r+" min":r+" min"}
async function planRoute(){const q=$("destination").value.trim();if(!q){status(t("notFound"));return} $("routeBtn").disabled=true;try{const located=await useGps();if(!located||!start)throw new Error(t("noStart"));clearRoute(false);status(t("searching"));const dest=await geocode(q);destinationPoint=dest;status(t("planning"));const u="https://router.project-osrm.org/route/v1/driving/"+start.lon+","+start.lat+";"+dest.lon+","+dest.lat+"?overview=full&geometries=geojson&steps=true";const res=await fetch(u);if(!res.ok)throw new Error(t("service"));const data=await res.json();if(data.code!=="Ok"||!data.routes?.length)throw new Error(t("service"));const r=data.routes[0];totalRouteDistance=r.distance||0;totalRouteDuration=r.duration||0;routeCoords=(r.geometry.coordinates||[]).map(c=>({lat:c[1],lon:c[0]}));routeLayer=L.geoJSON(r.geometry,{style:{color:"#1683d8",weight:7,opacity:.92}}).addTo(map);destMarker=L.marker([dest.lat,dest.lon]).addTo(map).bindPopup(dest.name);map.fitBounds(routeLayer.getBounds(),{padding:[24,24]});$("summary").textContent=t("distance")+": "+(r.distance/1000).toFixed(1)+" km · "+t("duration")+": "+duration(r.duration);const frag=document.createDocumentFragment();routeSteps=[];(r.legs||[]).forEach(leg=>(leg.steps||[]).forEach(s=>{const loc=s.maneuver?.location;if(loc&&loc.length>=2)routeSteps.push({lat:loc[1],lon:loc[0],text:stepText(s),road:s.name||"",distance:s.distance||0});const li=document.createElement("li");const d=s.distance>=1000?(s.distance/1000).toFixed(1)+" km":Math.round(s.distance)+" m";li.textContent=stepText(s)+(s.name?" — "+s.name:"")+" ("+d+")";frag.appendChild(li)}));$("steps").appendChild(frag);$("startNavBtn").disabled=false;status(t("routeReady"))}catch(e){status(e.message||t("service"))}finally{$("routeBtn").disabled=false}}
function distanceM(a,b){const rad=x=>x*Math.PI/180;const R=6371000;const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

 // Local equirectangular projection is sufficiently accurate for short GPS offsets.

 let best=Infinity;
 const stride=Math.max(1,Math.floor(routeCoords.length/1200));
 for(let i=0;i<routeCoords.length-1;i+=stride){
  const a=xy(routeCoords[i]), b=xy(routeCoords[Math.min(i+stride,routeCoords.length-1)]);

async function recalculateFrom(pos){

 rerouteBusy=true;lastReroute=Date.now();status(t("rerouting"));say(t("rerouting"));
 try{
  const u="https://router.project-osrm.org/route/v1/driving/"+pos.lon+","+pos.lat+";"+destinationPoint.lon+","+destinationPoint.lat+"?overview=full&geometries=geojson&steps=true";
  const res=await fetch(u);if(!res.ok)throw new Error(t("service"));
  const data=await res.json();if(data.code!=="Ok"||!data.routes?.length)throw new Error(t("service"));
  const r=data.routes[0];totalRouteDistance=r.distance||0;totalRouteDuration=r.duration||0;if(routeLayer)map.removeLayer(routeLayer);
  routeCoords=(r.geometry.coordinates||[]).map(c=>({lat:c[1],lon:c[0]}));
  routeLayer=L.geoJSON(r.geometry,{style:{color:"#1683d8",weight:7,opacity:.92}}).addTo(map);
  routeSteps=[];(r.legs||[]).forEach(leg=>(leg.steps||[]).forEach(st=>{const loc=st.maneuver?.location;if(loc&&loc.length>=2)routeSteps.push({lat:loc[1],lon:loc[0],text:stepText(st),road:st.name||"",distance:st.distance||0})}));

  const frag=document.createDocumentFragment();(r.legs||[]).forEach(leg=>(leg.steps||[]).forEach(st=>{const li=document.createElement("li");const d=st.distance>=1000?(st.distance/1000).toFixed(1)+" km":Math.round(st.distance)+" m";li.textContent=stepText(st)+(st.name?" — "+st.name:"")+" ("+d+")";frag.appendChild(li)}));$("steps").replaceChildren(frag);

}
function updateLiveSummary(){
 const remaining=routeSteps.slice(stepCursor).reduce((sum,st)=>sum+(st.distance||0),0);
 const ratio=totalRouteDistance>0?Math.min(1,remaining/totalRouteDistance):0;
 const remainSec=totalRouteDuration*ratio;
 const eta=new Date(Date.now()+remainSec*1000);
 const etaText=eta.toLocaleTimeString(lang==="zh"?"zh-CN":lang==="ms"?"ms-MY":"en-MY",{hour:"2-digit",minute:"2-digit"});
 const distText=remaining>=1000?(remaining/1000).toFixed(1)+" km":Math.round(remaining)+" m";
 const labels=lang==="zh"?"剩余约 "+distText+" · 预计到达 "+etaText:lang==="ms"?"Baki kira-kira "+distText+" · Tiba sekitar "+etaText:"About "+distText+" remaining · ETA "+etaText;
 $("liveSummary").textContent=labels;
}
function updateBanner(pos){
 // Avoid false reroutes when the phone reports poor GPS accuracy.
 if(routeCoords.length>1){
  const accuracy=Number.isFinite(pos.accuracy)?pos.accuracy:50;
  const off=nearestRouteDistance(pos);
  const threshold=Math.max(70,Math.min(120,accuracy*1.5));
  if(accuracy<=80&&off>threshold){
   offRouteCount++;
   if(offRouteCount>=3&&!rerouteBusy){offRouteCount=0;recalculateFrom(pos)}
  }else{offRouteCount=0;offRouteWarned=false}
 }
 if(!routeSteps.length)return;
 while(stepCursor<routeSteps.length-1&&distanceM(pos,routeSteps[stepCursor])<35)stepCursor++;
 const st=routeSteps[Math.min(stepCursor,routeSteps.length-1)],d=distanceM(pos,st);
 $("navBanner").style.display="block";$("nextTurn").textContent=st.text;$("nextRoad").textContent=(st.road?st.road+" · ":"")+Math.max(0,Math.round(d))+" "+t("meters");updateLiveSummary();
 if(d<250&&lastSpoken!==stepCursor){say(st.text+(st.road?(lang==="zh"?"，进入":lang==="ms"?" ke ":" onto ")+st.road:""));lastSpoken=stepCursor}
 if(stepCursor>=routeSteps.length-1&&d<35){status(t("arrived"));say(t("arrived"));stopNavigation(false);return}
}
function startNavigation(){
 if(watchId!==null)return;
 if(!start||!routeLayer){status(t("noStart"));return}
 if(!navigator.geolocation){status(t("noGps"));return}
 if("speechSynthesis" in window)say(t("navStarted"));else status(t("navStarted")+" (Voice not supported)");
 // Switch from whole-route overview to a close road-level navigation view.
 map.setView([start.lat,start.lon],17);
 watchId=navigator.geolocation.watchPosition(p=>{
  const pos={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};
  if(userMarker)userMarker.setLatLng([pos.lat,pos.lon]);else userMarker=L.circleMarker([pos.lat,pos.lon],{radius:9,color:"#fff",weight:3,fillColor:"#e05252",fillOpacity:1}).addTo(map).bindPopup("Current location / 当前位置");
  start=pos;if(map.getZoom()<17)map.setView([pos.lat,pos.lon],17,{animate:true});else map.panTo([pos.lat,pos.lon],{animate:true});updateBanner(pos)
 },()=>status(t("noGps")),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
 $("startNavBtn").disabled=true;$("stopNavBtn").disabled=false;status(t("navStarted"))
}
function stopNavigation(show=true){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(window.speechSynthesis)window.speechSynthesis.cancel();$("startNavBtn").disabled=!routeLayer;$("stopNavBtn").disabled=true;if(show)status(t("navStopped"))}
$("language").addEventListener("change",applyLanguage);$("fullscreenBtn").addEventListener("click",toggleFullscreen);$("routeBtn").addEventListener("click",planRoute);$("startNavBtn").addEventListener("click",startNavigation);$("stopNavBtn").addEventListener("click",()=>stopNavigation(true));$("destination").addEventListener("keydown",e=>{if(e.key==="Enter")planRoute()});
applyLanguage();useGps().catch(()=>status(t("noGps")));
})();
</script>
